name: Database Backup

on:
  schedule:
    # Run daily at 2 AM UTC (3 AM CET / 4 AM CEST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to backup'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging

concurrency:
  group: database-backup-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}

jobs:
  backup:
    name: Backup Database (${{ github.event.inputs.environment || 'prod' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 awscli

      - name: Verify required secrets
        shell: bash
        run: |
          MISSING_SECRETS=()

          if [ -z "${{ secrets.PROD_DATABASE_URL }}" ]; then
            MISSING_SECRETS+=("PROD_DATABASE_URL")
          fi

          if [ -z "${{ secrets.S3_BACKUP_ENDPOINT }}" ]; then
            MISSING_SECRETS+=("S3_BACKUP_ENDPOINT")
          fi

          if [ -z "${{ secrets.S3_BACKUP_ACCESS_KEY }}" ]; then
            MISSING_SECRETS+=("S3_BACKUP_ACCESS_KEY")
          fi

          if [ -z "${{ secrets.S3_BACKUP_SECRET_KEY }}" ]; then
            MISSING_SECRETS+=("S3_BACKUP_SECRET_KEY")
          fi

          if [ -z "${{ secrets.S3_BACKUP_BUCKET }}" ]; then
            MISSING_SECRETS+=("S3_BACKUP_BUCKET")
          fi

          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo "ERROR: Missing required secrets:"
            printf '%s\n' "${MISSING_SECRETS[@]}"
            exit 1
          fi

          echo "All required secrets are configured"

      - name: Run backup script
        env:
          DATABASE_URL: ${{ env.ENVIRONMENT == 'prod' && secrets.PROD_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
          S3_BACKUP_ENDPOINT: ${{ secrets.S3_BACKUP_ENDPOINT }}
          S3_BACKUP_ACCESS_KEY: ${{ secrets.S3_BACKUP_ACCESS_KEY }}
          S3_BACKUP_SECRET_KEY: ${{ secrets.S3_BACKUP_SECRET_KEY }}
          S3_BACKUP_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          chmod +x ./scripts/backup-database.sh
          ./scripts/backup-database.sh "${{ env.ENVIRONMENT }}"

      - name: Create backup summary
        if: success()
        run: |
          echo "## Database Backup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** \`${{ github.workflow }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Retention Policy" >> $GITHUB_STEP_SUMMARY
          echo "- **Daily:** 7 backups" >> $GITHUB_STEP_SUMMARY
          echo "- **Weekly:** 4 backups (Sundays)" >> $GITHUB_STEP_SUMMARY
          echo "- **Monthly:** 12 backups (1st of month)" >> $GITHUB_STEP_SUMMARY

      - name: Send failure notification
        if: failure()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data '{"text":"❌ Database backup failed for environment: ${{ env.ENVIRONMENT }}\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
              "${{ secrets.SLACK_WEBHOOK_URL }}"
          fi

          echo "## Database Backup Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the workflow logs for details." >> $GITHUB_STEP_SUMMARY

  verify-backup:
    name: Verify Backup
    runs-on: ubuntu-latest
    needs: backup
    if: success()
    timeout-minutes: 10

    steps:
      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      - name: Verify backup exists in S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_BACKUP_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_BACKUP_SECRET_KEY }}
          S3_BACKUP_ENDPOINT: ${{ secrets.S3_BACKUP_ENDPOINT }}
          S3_BACKUP_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
        run: |
          DATE=$(date +%Y%m%d)
          ENVIRONMENT="${{ env.ENVIRONMENT }}"

          echo "Checking for today's backup in S3..."

          if [ -n "$S3_BACKUP_ENDPOINT" ] && [ "$S3_BACKUP_ENDPOINT" != "https://s3.amazonaws.com" ]; then
            # S3-compatible storage
            BACKUP_COUNT=$(aws s3 ls "s3://${S3_BACKUP_BUCKET}/backups/${ENVIRONMENT}/" \
              --recursive \
              --endpoint-url "$S3_BACKUP_ENDPOINT" \
              --no-verify-ssl | grep "$DATE" | wc -l)
          else
            # AWS S3
            BACKUP_COUNT=$(aws s3 ls "s3://${S3_BACKUP_BUCKET}/backups/${ENVIRONMENT}/" \
              --recursive | grep "$DATE" | wc -l)
          fi

          if [ "$BACKUP_COUNT" -eq 0 ]; then
            echo "ERROR: No backup found for today (${DATE})"
            exit 1
          fi

          echo "Verification successful! Found ${BACKUP_COUNT} backup(s) for today."

      - name: Update verification summary
        if: success()
        run: |
          echo "## Backup Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Backup successfully verified in S3 storage." >> $GITHUB_STEP_SUMMARY
