version: "3.8"

# Production monitoring stack for Support Helper Platform
# Includes: Prometheus, Alertmanager, Grafana, and exporters

services:
  # ============================================
  # Prometheus - Metrics collection and storage
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: support-helper-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - support-network
      - monitoring-network
    depends_on:
      - postgres-exporter
      - redis-exporter

  # ============================================
  # Alertmanager - Alert routing and notification
  # ============================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: support-helper-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    networks:
      - monitoring-network

  # ============================================
  # Grafana - Metrics visualization dashboards
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: support-helper-grafana
    restart: unless-stopped
    ports:
      - "3100:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3100}
    networks:
      - monitoring-network
    depends_on:
      - prometheus

  # ============================================
  # PostgreSQL Exporter - Database metrics
  # ============================================
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: support-helper-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:-support123}@postgres:5432/${POSTGRES_DB:-support_helper}?sslmode=disable"
    networks:
      - support-network
      - monitoring-network
    depends_on:
      - postgres

  # ============================================
  # Redis Exporter - Redis metrics
  # ============================================
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: support-helper-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - support-network
      - monitoring-network
    depends_on:
      - redis

  # ============================================
  # Node Exporter - System metrics (optional)
  # ============================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: support-helper-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring-network

networks:
  # Connect to existing support-helper-network
  support-network:
    external: true
    name: support-helper-network

  # Monitoring-specific network
  monitoring-network:
    driver: bridge
    name: support-helper-monitoring

volumes:
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local
  grafana_data:
    driver: local
