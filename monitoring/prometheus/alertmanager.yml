global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'

# Routes define the tree of alert routing rules
route:
  receiver: 'default'
  group_by: ['alertname', 'severity', 'component']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 5s
      repeat_interval: 1h

    # Warning alerts - aggregated notifications
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 4h

    # Info alerts - low priority
    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 5m
      repeat_interval: 12h

# Receivers define notification destinations
receivers:
  # Default receiver (fallback)
  - name: 'default'
    slack_configs:
      - channel: '#support-helper-alerts'
        title: 'Support Helper Alert'
        text: |
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .CommonLabels.severity }}
          *Component:* {{ .CommonLabels.component }}
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          {{ if .CommonAnnotations.runbook_url }}*Runbook:* {{ .CommonAnnotations.runbook_url }}{{ end }}

  # Critical alerts - mention @channel
  - name: 'critical-alerts'
    slack_configs:
      - channel: '#support-helper-critical'
        title: '🚨 CRITICAL: Support Helper Alert'
        text: |
          <!channel>
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .CommonLabels.severity }}
          *Component:* {{ .CommonLabels.component }}
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          {{ if .CommonAnnotations.runbook_url }}*Runbook:* {{ .CommonAnnotations.runbook_url }}{{ end }}
        color: 'danger'
        send_resolved: true

  # Warning alerts
  - name: 'warning-alerts'
    slack_configs:
      - channel: '#support-helper-alerts'
        title: '⚠️ WARNING: Support Helper Alert'
        text: |
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .CommonLabels.severity }}
          *Component:* {{ .CommonLabels.component }}
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          {{ if .CommonAnnotations.runbook_url }}*Runbook:* {{ .CommonAnnotations.runbook_url }}{{ end }}
        color: 'warning'
        send_resolved: true

  # Info alerts
  - name: 'info-alerts'
    slack_configs:
      - channel: '#support-helper-alerts'
        title: 'ℹ️ INFO: Support Helper Alert'
        text: |
          *Alert:* {{ .GroupLabels.alertname }}
          *Component:* {{ .CommonLabels.component }}
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
        color: 'good'
        send_resolved: true

# Inhibition rules to suppress alerts
inhibit_rules:
  # If instance is down, suppress other alerts from that instance
  - source_match:
      alertname: 'APIInstanceDown'
    target_match_re:
      alertname: '.*'
    equal: ['instance']

  - source_match:
      alertname: 'WorkerInstanceDown'
    target_match_re:
      alertname: '.*'
    equal: ['instance']

  # If PostgreSQL is down, suppress DB-related alerts
  - source_match:
      alertname: 'PostgreSQLDown'
    target_match_re:
      alertname: '(DatabaseConnectionPoolHigh|SlowDatabaseQueries)'

  # If Redis is down, suppress cache-related alerts
  - source_match:
      alertname: 'RedisDown'
    target_match_re:
      alertname: '(RedisMemoryHigh|CacheHitRateLow)'
